<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Impacto del descuento en el margen: barras divergentes por tramo de descuento">
  <defs>
    <linearGradient id="pos" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="neg" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0b1120"/>

  <!-- retícula sutil -->
  <g stroke="#243250" stroke-width="1" opacity="0.55">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="184" y1="112" x2="184" y2="390"/>
    <line x1="302" y1="112" x2="302" y2="390"/>
    <line x1="538" y1="112" x2="538" y2="390"/>
  </g>

  <text x="48" y="52" fill="#8da2c0" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="1.6">POWER BI · RETAIL</text>
  <text x="48" y="88" fill="#dbe4f3" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Impacto del descuento en el margen</text>

  <!-- eje cero -->
  <line x1="420" y1="106" x2="420" y2="396" stroke="#8da2c0" stroke-width="1.5" opacity="0.85"/>

  <g font-family="IBM Plex Mono, monospace" font-size="14">
    <!-- Sin descuento: +29,51 % -->
    <text x="48" y="140" fill="#8da2c0">Sin desc.</text>
    <rect x="420" y="120" width="89" height="34" rx="4" fill="url(#pos)"/>
    <text x="519" y="142" fill="#34d399" font-weight="600">+29,51 %</text>

    <!-- 1-15 %: +12,75 % -->
    <text x="48" y="196" fill="#8da2c0">1–15 %</text>
    <rect x="420" y="176" width="38" height="34" rx="4" fill="url(#pos)"/>
    <text x="468" y="198" fill="#34d399" font-weight="600">+12,75 %</text>

    <!-- 16-25 %: +11,82 % -->
    <text x="48" y="252" fill="#8da2c0">16–25 %</text>
    <rect x="420" y="232" width="35" height="34" rx="4" fill="url(#pos)"/>
    <text x="465" y="254" fill="#34d399" font-weight="600">+11,82 %</text>

    <!-- 26-45 %: -15,99 % -->
    <text x="48" y="308" fill="#8da2c0">26–45 %</text>
    <rect x="372" y="288" width="48" height="34" rx="4" fill="url(#neg)"/>
    <text x="268" y="310" fill="#f87171" font-weight="600">−15,99 %</text>

    <!-- >45 %: -78,82 % -->
    <text x="48" y="364" fill="#8da2c0">&gt; 45 %</text>
    <rect x="184" y="344" width="236" height="34" rx="4" fill="url(#neg)"/>
    <!-- valor dentro de la barra: fuera no cabe sin pisar la etiqueta del tramo -->
    <text x="406" y="366" fill="#0b1120" font-weight="700" text-anchor="end">−78,82 %</text>
  </g>

  <text x="48" y="424" fill="#8da2c0" font-family="IBM Plex Mono, monospace" font-size="13">Pasando el 25 % de descuento, cada venta destruye valor · 9.994 transacciones</text>
</svg>
